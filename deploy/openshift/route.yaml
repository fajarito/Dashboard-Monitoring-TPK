apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard-monitoring-tpk
  labels:
    app: dashboard-monitoring-tpk
spec:
  # host: dashboard-tpk.apps.CLUSTER.example.com  # opsional; kosong = generate
  to:
    kind: Service
    name: dashboard-monitoring-tpk
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
