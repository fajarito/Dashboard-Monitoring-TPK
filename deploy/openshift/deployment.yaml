apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-monitoring-tpk
  labels:
    app: dashboard-monitoring-tpk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-monitoring-tpk
  template:
    metadata:
      labels:
        app: dashboard-monitoring-tpk
    spec:
      containers:
        - name: dashboard
          # Ganti ke registry/image tag cluster Anda.
          image: image-registry.openshift-image-registry.svc:5000/NAMESPACE/dashboard-monitoring-tpk:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dashboard-tpk-config
            - secretRef:
                name: dashboard-tpk-db
          env:
            # Pastikan PORT dari ConfigMap menang; fallback eksplisit.
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: dashboard-tpk-config
                  key: PORT
          # Jangan probe /api/ringkasan — itu query triple-pool DWH/SIGA.
          # Probe berat → pod NotReady + stampede DB saat cold start / UAT lambat.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      # OpenShift restricted SCC injects random UID; do not pin runAsUser.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
